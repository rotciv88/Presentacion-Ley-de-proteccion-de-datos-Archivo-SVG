<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación Ley de Protección de Datos</title>
    
    <!-- Etiquetas Open Graph para LinkedIn -->
    <meta property="og:title" content="Presentación: Ley de Protección de Datos">
    <meta property="og:description" content="Haz clic para ver la animación interactiva sobre la Ley de Protección de Datos.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rotciv88.github.io/Presentacion-Ley-de-proteccion-de-datos-Archivo-SVG/">
    
    <!-- IMPORTANTE: URL de la foto SIN ACENTOS -->
    <meta property="og:image" content="https://rotciv88.github.io/Presentacion-Ley-de-proteccion-de-datos-Archivo-SVG/exposicion-svg.png">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://rotciv88.github.io/Presentacion-Ley-de-proteccion-de-datos-Archivo-SVG/exposicion-svg.png">

    <style>
        /* Hacemos que el SVG ocupe toda la pantalla para que sea interactivo */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita barras de scroll */
            background-color: #f4f4f9;
        }
        .contenedor-svg {
            width: 100%;
            height: 100%;
        }
        /* El object ocupa todo el espacio y permite interactuar con el SVG */
        .contenedor-svg object {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Usamos OBJECT en lugar de IMG para permitir interactividad y JS -->
    <div class="contenedor-svg">
        <object type="image/svg+xml" data="trabajo-definitivo-exposicion.svg">
            <!-- Si el SVG no carga, se mostrará este texto -->
            Tu navegador no soporta SVG interactivo. 
            <a href="trabajo-definitivo-exposicion.svg">Haz clic aquí para verlo directamente</a>.
        </object>
    </div>

</body>
</html>

</body>
